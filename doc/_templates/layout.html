{% extends "!layout.html" %}

{% block navbarextra %}
  <li class="dropdown">
    <a role="button" class="dropdown-toggle" data-toggle="dropdown" href="#">
      Version: {{ current_version }} <b class="caret"></b>
    </a>
    <ul class="dropdown-menu" role="menu">
      <li><a href="{{ pathto(master_doc, 1)|e }}/../../latest/index.html">v:latest</a></li>
      <li><a href="{{ pathto(master_doc, 1)|e }}/../../stable/index.html">v:stable</a></li>
      {% if docs_versions %}
      {%- for ver in docs_versions %}
      <li><a href="{{ pathto(master_doc, 1)|e }}/../../{{ ver }}/index.html">{{ ver }}</a></li>
      {%- endfor %}
      {% endif %}
    </ul>
  </li>
{% endblock %}
